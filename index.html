<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AHM BOMBER</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #0b0f1c 0%, #1a1f2f 100%);
      padding: 1rem;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: rgba(18, 22, 36, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 2rem 1.8rem 1.5rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(0, 255, 255, 0.1), 0 0 30px rgba(0, 180, 255, 0.2);
      border: 1px solid rgba(0, 255, 255, 0.15);
      transition: 0.3s ease;
    }

    .title {
      text-align: center;
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #a0e9ff, #00c8ff, #0077ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(0, 200, 255, 0.5);
      margin-bottom: 2rem;
      word-break: break-word;
    }

    .input-group {
      margin-bottom: 1.8rem;
    }

    .input-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      color: #8a9bb5;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    .number-input {
      width: 100%;
      padding: 1rem 1.2rem;
      background: #0d1220;
      border: 1.5px solid #2a3448;
      border-radius: 60px;
      font-size: 1.1rem;
      color: #eef5ff;
      outline: none;
      transition: 0.25s;
      font-weight: 500;
      letter-spacing: 1px;
      box-shadow: inset 0 5px 10px rgba(0, 0, 0, 0.5);
    }

    .number-input:focus {
      border-color: #00c8ff;
      box-shadow: 0 0 18px rgba(0, 200, 255, 0.3), inset 0 5px 10px rgba(0, 0, 0, 0.5);
    }

    .number-input::placeholder {
      color: #4a556e;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: 0.2s ease;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-start {
      background: linear-gradient(145deg, #0066cc, #0099ff);
      color: white;
      box-shadow: 0 10px 20px -5px rgba(0, 150, 255, 0.5), 0 0 15px rgba(0, 180, 255, 0.3);
      margin-bottom: 1rem;
    }

    .btn-start:disabled {
      background: linear-gradient(145deg, #2a3a4e, #1e2a38);
      color: #7e8b9c;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
      border-color: #2a3a4e;
    }

    .btn-start i {
      font-size: 1.2rem;
    }

    .btn-telegram {
      background: linear-gradient(145deg, #1e2f4a, #0f1a2b);
      color: #9bd1ff;
      border: 1px solid #2a4b6e;
      box-shadow: 0 8px 15px -6px #00000080;
      margin-bottom: 2rem;
      font-weight: 600;
    }

    .btn-telegram i {
      color: #4db8ff;
      font-size: 1.3rem;
    }

    .btn-telegram:hover {
      background: linear-gradient(145deg, #254a6b, #142433);
      color: #c2e2ff;
      border-color: #4da6ff;
    }

    .log-section {
      margin-top: 1rem;
      background: #090c14;
      border-radius: 1.8rem;
      border: 1px solid #1d2a3a;
      overflow: hidden;
      box-shadow: inset 0 0 20px #00000080, 0 10px 25px #00000060;
    }

    .log-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0.9rem 1.4rem;
      background: #0c1120;
      border-bottom: 1px solid #1b2638;
      font-weight: 600;
      color: #a6c9ff;
      letter-spacing: 1.5px;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    .log-header i {
      color: #00e0ff;
      font-size: 1rem;
    }

    .terminal {
      padding: 1.2rem 1.2rem;
      height: 140px;
      overflow-y: auto;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #c0d9f0;
      background: #05080f;
      scrollbar-width: thin;
      scrollbar-color: #1e4c6b #0a101c;
    }

    .terminal::-webkit-scrollbar {
      width: 5px;
    }

    .terminal::-webkit-scrollbar-track {
      background: #0a101c;
    }

    .terminal::-webkit-scrollbar-thumb {
      background: #1e4c6b;
      border-radius: 20px;
    }

    .log-line {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #0f1824;
      padding: 4px 0;
      color: #b7d0e5;
      word-break: break-all;
    }

    .log-time {
      color: #4f8bb9;
      font-weight: 500;
      flex-shrink: 0;
    }

    .log-msg {
      color: #c6e0ff;
    }

    .log-msg.error {
      color: #ff7b7b;
    }

    .log-msg.success {
      color: #7bffb0;
    }

    .api-credit {
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 1px;
      color: #3f5068;
      margin-top: 1rem;
      font-weight: 400;
      text-transform: uppercase;
    }

    .api-credit i {
      color: #2f4a62;
      margin-right: 4px;
    }

    /* cooldown indicator */
    .cooldown-badge {
      font-size: 0.8rem;
      background: #0f1b2b;
      padding: 4px 10px;
      border-radius: 30px;
      color: #94b8dc;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #1f3d5c;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">AHM BOMBER</div>

    <div class="input-group">
      <label class="input-label"><i class="fas fa-hashtag" style="margin-right: 6px;"></i>Number</label>
      <input type="text" id="numberInput" class="number-input" placeholder="01XXXXXXXXX" value="018XXXXXXXX" autocomplete="off">
    </div>

    <!-- Start button with timer -->
    <button id="startBtn" class="btn btn-start">
      <i class="fas fa-rocket"></i> START
    </button>

    <!-- Join Telegram button -->
    <button id="telegramBtn" class="btn btn-telegram">
      <i class="fab fa-telegram-plane"></i> JOIN TELEGRAM
    </button>

    <!-- Log Terminal -->
    <div class="log-section">
      <div class="log-header">
        <i class="fas fa-terminal"></i> LOG
      </div>
      <div id="terminal" class="terminal">
        <div class="log-line">
          <span class="log-time">[--:--]</span>
          <span class="log-msg">System ready. Enter number and press START.</span>
        </div>
      </div>
    </div>

    <!-- API Credit (tiny) -->
    <div class="api-credit">
      <i class="fas fa-code"></i> Api From Misbah Modder
    </div>
  </div>

  <script>
    (function() {
      const startBtn = document.getElementById('startBtn');
      const telegramBtn = document.getElementById('telegramBtn');
      const numberInput = document.getElementById('numberInput');
      const terminal = document.getElementById('terminal');

      // API endpoint (with placeholder)
      const API_BASE = 'https://nid.proo.one/sms.php?number=';

      // Cooldown management
      let isCooldown = false;
      let cooldownTimer = null;

      // Helper: add log entry
      function addLog(message, type = 'info') {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const logLine = document.createElement('div');
        logLine.className = 'log-line';

        const timeSpan = document.createElement('span');
        timeSpan.className = 'log-time';
        timeSpan.textContent = `[${timeStr}]`;

        const msgSpan = document.createElement('span');
        msgSpan.className = `log-msg ${type === 'error' ? 'error' : type === 'success' ? 'success' : ''}`;
        msgSpan.textContent = message;

        logLine.appendChild(timeSpan);
        logLine.appendChild(msgSpan);
        terminal.appendChild(logLine);

        // Auto-scroll to bottom
        terminal.scrollTop = terminal.scrollHeight;

        // Keep terminal tidy (max 50 lines)
        if (terminal.children.length > 50) {
          terminal.removeChild(terminal.children[0]);
        }
      }

      // Reset button state after cooldown
      function resetStartButton() {
        isCooldown = false;
        startBtn.disabled = false;
        startBtn.innerHTML = '<i class="fas fa-rocket"></i> START';
        if (cooldownTimer) {
          clearTimeout(cooldownTimer);
          cooldownTimer = null;
        }
      }

      // Start button handler
      startBtn.addEventListener('click', function() {
        if (isCooldown) return; // extra safety

        const number = numberInput.value.trim();
        if (!number) {
          addLog('Please enter a number.', 'error');
          return;
        }

        // Basic number validation (optional, but keeps log clean)
        if (!/^[0-9+\-\s()]{5,20}$/.test(number)) {
          addLog('Invalid number format. Use digits and +-()', 'error');
          return;
        }

        // Enter cooldown state
        isCooldown = true;
        startBtn.disabled = true;
        startBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> WAIT 2s...';

        // Log the API call
        addLog(`Requesting: ${number}`, 'info');

        // Build API URL (replace number)
        const apiUrl = API_BASE + encodeURIComponent(number);

        // Fetch API (with error handling)
        fetch(apiUrl)
          .then(response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.text(); // API returns plain text maybe
          })
          .then(data => {
            // Truncate long response for log
            const preview = data.length > 80 ? data.slice(0, 80) + '...' : data;
            addLog(`Response: ${preview}`, 'success');
          })
          .catch(error => {
            addLog(`API Error: ${error.message}`, 'error');
          })
          .finally(() => {
            // After 2 seconds from click, re-enable button
            // But we already started cooldown; we want exactly 2 sec from click.
            // Use setTimeout 2s to reset, but we should also clear if needed.
          });

        // Clear any previous cooldown timer
        if (cooldownTimer) clearTimeout(cooldownTimer);

        // Set timer: after 2 seconds re-enable start button
        cooldownTimer = setTimeout(() => {
          resetStartButton();
          addLog('Cooldown finished. Ready.', 'info');
        }, 2000);

        // Note: If user clicks telegram while cooldown, it's fine.
      });

      // Telegram button handler
      telegramBtn.addEventListener('click', function() {
        addLog('Opening Telegram...', 'info');
        window.open('https://t.me/ahm_bomber', '_blank'); // placeholder link
      });

      // Allow pressing Enter in number input to trigger start (if not in cooldown)
      numberInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (!isCooldown) {
            startBtn.click();
          } else {
            addLog('Please wait for cooldown.', 'error');
          }
        }
      });

      // Initialize with a log line
      addLog('AHM BOMBER ready.', 'info');
    })();
  </script>
</body>
</html>
